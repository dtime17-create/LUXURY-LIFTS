<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Luxury Lifts</title>
<!-- Leaflet CSS for Real Interactive Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #08090c; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Crisp High-Quality Professional Day Map Container */
#map { width: 100%; height: 220px; min-height: 220px; position: relative; z-index: 1; border-bottom: 1px solid #1a1d26; }
.leaflet-container { background: #f0f3f6 !important; }

/* Custom Cadillac CT4 Map Pin Badge */
.custom-car-marker div {
  background: #ffffff;
  border: 2px solid #1a1d24;
  color: #1a1d24;
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* App Top Navigation (Dark with Gold) */
.navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #08090c; border-bottom: 1px solid #1a1d26; }
.navbar h1 { font-size: 18px; color: #d4af37; letter-spacing: 1px; font-weight: 700; }
.status-pill { background: rgba(212, 175, 55, 0.15); color: #d4af37; font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3); font-weight: 600; text-transform: uppercase; }

/* Main Dark Ride Sheet */
.sheet { flex: 1; background: #12151e; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 15px 20px 20px 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); border-top: 1px solid #222634; overflow-y: auto; display: flex; flex-direction: column; }
.sheet-handle { width: 40px; height: 4px; background: #2f3446; border-radius: 2px; margin: 0 auto 12px auto; }

.input-group { position: relative; margin-bottom: 10px; }
.input-group label { position: absolute; left: 14px; top: 8px; font-size: 10px; text-transform: uppercase; color: #8c93a8; letter-spacing: 1px; font-weight: bold; z-index: 2; }
.input-group input { width: 100%; padding: 24px 14px 8px 14px; background: #1a1e2b; border: 1px solid #282d3d; border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
.input-group input:focus { border-color: #d4af37; }

/* Ride Selector Option Card */
.ride-option { display: flex; align-items: center; justify-content: space-between; background: #1a1e2b; border: 2px solid #d4af37; border-radius: 12px; padding: 10px 16px; margin: 8px 0; }
.ride-info h3 { font-size: 15px; color: #fff; margin-bottom: 2px; font-weight: 700; }
.ride-info p { font-size: 12px; color: #9da3b8; }
.ride-price { font-size: 18px; font-weight: bold; color: #d4af37; }

/* Action Buttons */
.btn-primary { width: 100%; padding: 14px; background: #d4af37; color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.2s; }
.btn-primary:hover { background: #e5be40; }
.cashapp-btn { width: 100%; padding: 12px; background: #00D632; color: #000; border-radius: 12px; font-size: 15px; font-weight: bold; text-align: center; text-decoration: none; display: block; margin-top: 8px; box-sizing: border-box; }

/* Bottom Nav Bar */
.bottom-nav { display: flex; justify-content: space-around; background: #08090c; border-top: 1px solid #141721; padding: 10px 0; }
.nav-item { text-align: center; color: #6e758c; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; cursor: pointer; }
.nav-item.active { color: #d4af37; }
.nav-item span { display: block; font-size: 18px; margin-bottom: 2px; }
</style>
</head>
<body>

<div class="navbar">
  <h1>LUXURY LIFTS</h1>
  <div class="status-pill">● CT4 Ready</div>
</div>

<!-- Light Map Up Top -->
<div id="map"></div>

<!-- Dark Luxury Sheet on Bottom -->
<div class="sheet">
  <div class="sheet-handle"></div>
  
  <form id="form">
    <div class="input-group">
      <label for="pickup">Pickup</label>
      <input type="text" id="pickup" value="2323 North Oakley" autocomplete="off" required>
    </div>
    
    <div class="input-group">
      <label for="dropoff">Dropoff</label>
      <input type="text" id="dropoff" value="711 South Euclid, Bay City" autocomplete="off" required>
    </div>

    <div class="input-group" style="margin-bottom: 5px;">
      <label for="passengers">Passengers</label>
      <input type="number" id="passengers" value="1" min="1" required>
    </div>

    <div class="ride-option">
      <div class="ride-info">
        <h3>Cadillac CT4 Luxury</h3>
        <p>Private Chauffeur • 350T Turbo</p>
      </div>
      <div class="ride-price" id="tier-price">$30.00</div>
    </div>

    <button type="submit" class="btn-primary">Request Luxury Lift</button>
    <a href="https://cash.app/$FlipBucks11" target="_blank" class="cashapp-btn">Pay with Cash App</a>
  </form>
</div>

<div class="bottom-nav">
  <div class="nav-item active">
    <span>🚗</span>Book
  </div>
  <div class="nav-item" onclick="alert('Direct Dispatch: 989-964-1792')">
    <span>📞</span>Support
  </div>
  <div class="nav-item" onclick="window.open('https://cash.app/$FlipBucks11', '_blank')">
    <span>💵</span>Cash App
  </div>
</div>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: false }).setView([43.4195, -83.9531], 13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  attribution: ''
}).addTo(map);

const ct4Icon = L.divIcon({
  className: 'custom-car-marker',
  html: '<div>🚗 Cadillac CT4 Ready</div>',
  iconSize: [130, 36],
  iconAnchor: [65, 18]
});
L.marker([43.4195, -83.9531], { icon: ct4Icon }).addTo(map);

const pickupInput = document.getElementById('pickup');
const dropoffInput = document.getElementById('dropoff');
const passInput = document.getElementById('passengers');
const tierPrice = document.getElementById('tier-price');

function calculateFare() {
  const p = pickupInput.value.toLowerCase();
  const d = dropoffInput.value.toLowerCase();

  const isBayCity = (text) => text.includes('bay city') || text.includes('euclid') || text.includes('baycounty');
  const isMidland = (text) => text.includes('midland');
  const isFrankenmuth = (text) => text.includes('frankenmuth');
  const isBridgeport = (text) => text.includes('bridgeport');

  const pOuter = isBayCity(p) || isMidland(p) || isFrankenmuth(p) || isBridgeport(p);
  const dOuter = isBayCity(d) || isMidland(d) || isFrankenmuth(d) || isBridgeport(d);

  // 1. Dropoff is Out-of-Town from Local Saginaw ($15 Pickup)
  if (!pOuter && isBridgeport(d)) return 20;
  if (!pOuter && (isBayCity(d) || isFrankenmuth(d))) return 30;
  if (!pOuter && isMidland(d)) return 45;

  // 2. Pickup is Out-of-Town going to Local Saginaw
  if (isBridgeport(p) && !dOuter) return 25;
  if ((isBayCity(p) || isFrankenmuth(p)) && !dOuter) return 45;
  if (isMidland(p) && !dOuter) return 45;

  // 3. Both local Saginaw
  if (!pOuter && !dOuter) return 15;

  // 4. Inter-city fallback
  return 35;
}

function updatePrice() {
  const total = calculateFare();
  tierPrice.innerText = `$${total.toFixed(2)}`;
}

// Ensure execution on initialization
updatePrice();

// Attach direct event listeners for every possible input trigger
['input', 'keyup', 'change', 'paste'].forEach(eventType => {
  pickupInput.addEventListener(eventType, updatePrice);
  dropoffInput.addEventListener(eventType, updatePrice);
});

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  const p = pickupInput.value;
  const d = dropoffInput.value;
  const pass = passInput.value;
  const total = calculateFare();
  window.location.href = `sms:9899641792?body=` + encodeURIComponent(`New Ride Request!\nVehicle: Cadillac CT4 350T\nPickup: ${p}\nDropoff: ${d}\nPassengers: ${pass}\nTotal: $${total.toFixed(2)}`);
});
</script>
</body>
</html>
