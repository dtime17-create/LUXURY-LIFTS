<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Lifts</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: #16161a;
      --accent: #d4af37;
      --text: #ffffff;
      --sub: #94a1b2;
      --border: #333333;
    }
    * {

      margin: 0;
      padding: 0;

      min-height: 100vh;
      padding: 20px;
