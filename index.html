<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Lifts | Premium Local Rides</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: rgba(22, 22, 26, 0.95);
      --accent: #d4af37;
      --cashapp: #00D632;
      --text: #ffffff;
      --subtext: #94a1b2;
      --border: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      color: var(--accent);
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .header p {
      color: var(--subtext);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: var(--subtext);
      font-size: 0.85rem;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>Luxury Lifts</h1>
      <p>Great Lakes Bay Region Rides</p>
    </div>

    <form id="booking-form">
      <div class="form-group">
        <label for="pickup">Pickup Location</label>
        <input type="text" id="pickup" placeholder="Enter pickup address" required>
      </div>

      <div class="form-group">
        <label for="dropoff">Drop-off Location</label>
        <input type="text" id="dropoff" placeholder="Enter destination address" required>
      </div>

      <div class="form-group">
        <label for="passengers">Extra Passengers</label>
        <select id="passengers">
          <option value="0">Just me (0 extra)</option>
          <option value="1">1 Extra Passenger</option>
          <option value="2">2 Extra Passengers</option>
          <option value="3">3 Extra Passengers</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Calculate Fare</button>
    </form>
  </div>

</body>
</html>
