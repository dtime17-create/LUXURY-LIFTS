<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Luxury Lifts</title>
<!-- Leaflet CSS for Real Interactive Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #f4f6f9; color: #1a1d24; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Crisp High-Quality Professional Day Map Container */
#map { width: 100%; height: 250px; min-height: 250px; position: relative; z-index: 1; border-bottom: 1px solid #dcdfe6; }

/* Custom Styling for Leaflet attribution and zoom to match light theme */
.leaflet-container { background: #f0f3f6 !important; }

/* Custom Cadillac CT4 Map Pin Badge */
.custom-car-marker div {
  background: #ffffff;
  border: 2px solid #1a1d24;
  color: #1a1d24;
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* App Top Navigation */
.navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #ffffff; border-bottom: 1px solid #e2e5ec; }
.navbar h1 { font-size: 18px; color: #1a1d24; letter-spacing: 1px; font-weight: 800; }
.status-pill { background: rgba(0, 180, 80, 0.1); color: #008a3b; font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(0, 180, 80, 0.2); font-weight: 700; text-transform: uppercase; }

/* Main Ride Sheet */
.sheet { flex: 1; background: #ffffff; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px 20px 25px 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.08); border-top: 1px solid #e9edf2; overflow-y: auto; display: flex; flex-direction: column; }
.sheet-handle { width: 40px; height: 4px; background: #d2d6df; border-radius: 2px; margin: 0 auto 15px auto; }

.input-group { position: relative; margin-bottom: 10px; }
.input-group label { position: absolute; left: 14px; top: 8px; font-size: 10px; text-transform: uppercase; color: #737b8c; letter-spacing: 1px; font-weight: bold; }
.input-group input { width: 100%; padding: 24px 14px 8px 14px; background: #f7f9fc; border: 1px solid #dce1eb; border-radius: 10px; color: #1a1d24; font-size: 15px; outline: none; transition: border-color 0.2s; }
.input-group input:focus { border-color: #1a1d24; background: #fff; }

/* Ride Selector Option Card */
.ride-option { display: flex; align-items: center; justify-content: space-between; background: #f7f9fc; border: 2px solid #1a1d24; border-radius: 12px; padding: 10px 16px; margin: 10px 0; }
.ride-info h3 { font-size: 15px; color: #1a1d24; margin-bottom: 2px; font-weight: 700; }
.ride-info p { font-size: 12px; color: #606778; }
.ride-price { font-size: 18px; font-weight: 800; color: #1a1d24; }

/* Action Buttons */
.btn-primary { width: 100%; padding: 14px; background: #1a1d24; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.2s; }
.btn-primary:hover { background: #333842; }
.cashapp-btn { width: 100%; padding: 12px; background: #00D632; color: #000; border-radius: 12px; font-size: 15px; font-weight: bold; text-align: center; text-decoration: none; display: block; margin-top: 8px; box-sizing: border-box; }

/* Bottom Nav Bar */
.bottom-nav { display: flex; justify-content: space-around; background: #ffffff; border-top: 1px solid #e2e5ec; padding: 10px 0; }
.nav-item { text-align: center; color: #737b8c; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; cursor: pointer; }
.nav-item.active { color: #1a1d24; }
.nav-item span { display: block; font-size: 18px; margin-bottom: 2px; }
</style>
</head>
<body>

<div class="navbar">
  <h1>LUXURY LIFTS</h1>
  <div class="status-pill">● CT4 Ready</div>
</div>

<!-- Real High Quality Light Map -->
<div id="map"></div>

<div class="sheet">
  <div class="sheet-handle"></div>
  
  <form id="form">
    <div class="input-group">
      <label for="pickup">Pickup</label>
      <input type="text" id="pickup" placeholder="e.g. Bay Road, Janes St..." required>
    </div>
    
    <div class="input-group">
      <label for="dropoff">Dropoff</label>
      <input type="text" id="dropoff" placeholder="e.g. Frankenmuth, Midland..." required>
    </div>

    <div class="input-group" style="margin-bottom: 5px;">
      <label for="passengers">Passengers</label>
      <input type="number" id="passengers" value="1" min="1" required>
    </div>

    <div class="ride-option">
      <div class="ride-info">
        <h3>Cadillac CT4 Luxury</h3>
        <p>Private Chauffeur • 350T Turbo</p>
      </div>
      <div class="ride-price" id="tier-price">$15.00</div>
    </div>

    <button type="submit" class="btn-primary">Request Luxury Lift</button>
    <a href="https://cash.app/$FlipBucks11" target="_blank" class="cashapp-btn">Pay with Cash App</a>
  </form>
</div>

<div class="bottom-nav">
  <div class="nav-item active">
    <span>🚗</span>Book
  </div>
  <div class="nav-item" onclick="alert('Direct Dispatch: 989-964-1792')">
    <span>📞</span>Support
  </div>
  <div class="nav-item" onclick="window.open('https://cash.app/$FlipBucks11', '_blank')">
    <span>💵</span>Cash App
  </div>
</div>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Initialize high-quality vector map centered on Saginaw, MI
const map = L.map('map', { zoomControl: false }).setView([43.4195, -83.9531], 13);

// Use professional CartoDB Positron tiles (clean, high-end light daytime vector map style used by modern tech apps)
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  attribution: ''
}).addTo(map);

// Add custom crisp marker for your Cadillac CT4 position
const ct4Icon = L.divIcon({
  className: 'custom-car-marker',
  html: '<div>🚗 Cadillac CT4 Ready</div>',
  iconSize: [130, 36],
  iconAnchor: [65, 18]
});
L.marker([43.4195, -83.9531], { icon: ct4Icon }).addTo(map);

const pickupInput = document.getElementById('pickup');
const dropoffInput = document.getElementById('dropoff');
const passInput = document.getElementById('passengers');
const tierPrice = document.getElementById('tier-price');

function calculateFare() {
  let p = pickupInput.value.toLowerCase().trim();
  let d = dropoffInput.value.toLowerCase().trim();

  if(p && !p.includes('saginaw') && !p.includes('bridgeport') && !p.includes('frankenmuth') && !p.includes('bay city') && !p.includes('midland') && !p.includes('oakley')) {
    p = p + ' saginaw';
  }
  if(d && !d.includes('saginaw') && !d.includes('bridgeport') && !d.includes('frankenmuth') && !d.includes('bay city') && !d.includes('midland') && !d.includes('oakley')) {
    d = d + ' saginaw';
  }

  const isSaginawCityOrTownship = (text) => text.includes('saginaw') || text.includes('oakley') || text.includes('bay road') || text.includes('mackinaw') || text.includes('janes') || text.includes('washington') || text.includes('michigan') || text.includes('tittabawassee') || text.includes('state') || text.includes('court');
  const isBridgeport = (text) => text.includes('bridgeport');
  const isFrankenmuth = (text) => text.includes('frankenmuth');
  const isBayCity = (text) => text.includes('bay city');
  const isMidland = (text) => text.includes('midland');

  if (isSaginawCityOrTownship(p) && isSaginawCityOrTownship(d)) return 15;
  if (isSaginawCityOrTownship(p) && isBridgeport(d)) return 20;
  if (isBridgeport(p) && isSaginawCityOrTownship(d)) return 25;
  if (isSaginawCityOrTownship(p) && (isFrankenmuth(d) || isBayCity(d))) return 30;
  if ((isFrankenmuth(p) || isBayCity(p)) && isSaginawCityOrTownship(d)) return 45;
  if ((isSaginawCityOrTownship(p) && isMidland(d)) || (isMidland(p) && isSaginawCityOrTownship(d))) return 45;

  return 35;
}

function updatePrice() {
  const pText = pickupInput.value.trim();
  const dText = dropoffInput.value.trim();
  if (pText.length > 0 && dText.length > 0) {
    const total = calculateFare();
    tierPrice.innerText = `$${total.toFixed(2)}`;
  } else {
    tierPrice.innerText = `$15.00`;
  }
}

pickupInput.addEventListener('input', updatePrice);
dropoffInput.addEventListener('input', updatePrice);
passInput.addEventListener('input', updatePrice);

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  const p = pickupInput.value;
  const d = dropoffInput.value;
  const pass = passInput.value;
  const total = calculateFare();
  window.location.href = `sms:9899641792?body=` + encodeURIComponent(`New Ride Request!\nVehicle: Cadillac CT4 350T\nPickup: ${p}\nDropoff: ${d}\nPassengers: ${pass}\nTotal: $${total.toFixed(2)}`);
});
</script>
</body>
</html>
