<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luxury Lifts | Cadillac CT4 Service</title>
<style>
body { background: #0a0a0a; color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.box { width: 100%; max-width: 420px; background: #161616; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); border: 1px solid #333; }
.header { text-align: center; margin-bottom: 20px; }
h2 { color: #d4af37; margin: 0 0 5px 0; font-size: 26px; letter-spacing: 1px; }
.subtitle { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }
.vehicle-badge { background: #222; border: 1px solid #d4af37; color: #d4af37; padding: 10px; border-radius: 6px; text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
label { display: block; margin-top: 14px; font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
input { width: 100%; padding: 14px; margin-top: 6px; box-sizing: border-box; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 16px; transition: border-color 0.2s; }
input:focus { border-color: #d4af37; outline: none; }
.estimate { background: #1f1f1f; padding: 14px; margin-top: 20px; text-align: center; border-radius: 6px; font-size: 20px; font-weight: bold; color: #d4af37; border: 1px dashed #444; display: none; }
button[type="submit"] { width: 100%; padding: 14px; margin-top: 20px; background: #d4af37; color: #000; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
button[type="submit"]:hover { background: #e5be40; }
.cashapp-btn { width: 100%; padding: 14px; margin-top: 10px; background: #00D632; color: #000; border-radius: 6px; font-size: 16px; font-weight: bold; text-align: center; text-decoration: none; display: block; box-sizing: border-box; transition: opacity 0.2s; }
.cashapp-btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="box">
<div class="header">
<h2>LUXURY LIFTS</h2>
<div class="subtitle">First-Class Private Transport</div>
</div>

<div class="vehicle-badge">
  <span>✨ Ride in Style: 2023 Cadillac CT4 350T</span>
</div>

<form id="form">
<label for="pickup">Pickup Location</label>
<input type="text" id="pickup" placeholder="Enter pickup address/city" required>

<label for="dropoff">Dropoff Location</label>
<input type="text" id="dropoff" placeholder="Enter dropoff address/city" required>

<label for="passengers">Number of Passengers</label>
<input type="number" id="passengers" value="1" min="1" required>

<div class="estimate" id="price-display">Estimated Fare: $15.00</div>

<button type="submit">Book Ride via Text</button>
<a href="https://cash.app/$FlipBucks11" target="_blank" class="cashapp-btn">Pay with Cash App</a>
</form>
</div>

<script>
const pickupInput = document.getElementById('pickup');
const dropoffInput = document.getElementById('dropoff');
const passInput = document.getElementById('passengers');
const priceDisplay = document.getElementById('price-display');

function calculateFare() {
  const p = pickupInput.value.toLowerCase();
  const d = dropoffInput.value.toLowerCase();

  const isSaginawCityOrTownship = (text) => text.includes('saginaw') || text.includes('oakley') || text.includes('bay road') || text.includes('mackinaw') || text.includes('janes') || text.includes('washington') || text.includes('michigan') || text.includes('tittabawassee') || text.includes('state') || text.includes('court');
  const isBridgeport = (text) => text.includes('bridgeport');
  const isFrankenmuth = (text) => text.includes('frankenmuth');
  const isBayCity = (text) => text.includes('bay city');
  const isMidland = (text) => text.includes('midland');

  // Within Saginaw City or Saginaw Township ($15)
  if (isSaginawCityOrTownship(p) && isSaginawCityOrTownship(d)) {
    return 15;
  }
  
  // Saginaw City to Bridgeport ($20)
  if (isSaginawCityOrTownship(p) && isBridgeport(d)) {
    return 20;
  }
  
  // Bridgeport to Saginaw City ($25)
  if (isBridgeport(p) && isSaginawCityOrTownship(d)) {
    return 25;
  }
  
  // Saginaw City to Frankenmuth or Bay City ($30)
  if (isSaginawCityOrTownship(p) && (isFrankenmuth(d) || isBayCity(d))) {
    return 30;
  }
  
  // Frankenmuth or Bay City to Saginaw City ($45)
  if ((isFrankenmuth(p) || isBayCity(p)) && isSaginawCityOrTownship(d)) {
    return 45;
  }
  
  // Saginaw City to Midland (either direction) ($45)
  if ((isSaginawCityOrTownship(p) && isMidland(d)) || (isMidland(p) && isSaginawCityOrTownship(d))) {
    return 45;
  }

  // Default baseline fare for unlisted routes ($35)
  return 35;
}

function updatePrice() {
  const pText = pickupInput.value.trim();
  const dText = dropoffInput.value.trim();
  if (pText.length > 0 && dText.length > 0) {
    const total = calculateFare();
    priceDisplay.innerText = `Estimated Fare: $${total.toFixed(2)}`;
    priceDisplay.style.display = 'block';
  } else {
    priceDisplay.style.display = 'none';
  }
}

pickupInput.addEventListener('input', updatePrice);
dropoffInput.addEventListener('input', updatePrice);
passInput.addEventListener('input', updatePrice);

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  const p = pickupInput.value;
  const d = dropoffInput.value;
  const pass = passInput.value;
  const total = calculateFare();
  window.location.href = `sms:9899641792?body=` + encodeURIComponent(`New Ride Request!\nVehicle: Cadillac CT4 350T\nPickup: ${p}\nDropoff: ${d}\nPassengers: ${pass}\nTotal: $${total.toFixed(2)}`);
});
</script>
</body>
</html>
