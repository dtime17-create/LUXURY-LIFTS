<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Luxury Lifts</title>
<!-- Leaflet CSS for Real Interactive Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #050608; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Crisp High-Quality Professional Day Map Container */
#map { width: 100%; height: 190px; min-height: 190px; position: relative; z-index: 1; border-bottom: 1px solid #1a1d26; }
.leaflet-container { background: #f0f3f6 !important; }

/* Custom Cadillac CT4 Map Pin Badge */
.custom-car-marker div {
  background: #ffffff;
  border: 2px solid #1a1d24;
  color: #1a1d24;
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* App Top Navigation (Dark with Gold) */
.navbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #050608; border-bottom: 1px solid #1a1d26; }
.navbar h1 { font-size: 17px; color: #d4af37; letter-spacing: 1px; font-weight: 700; }
.status-pill { background: rgba(212, 175, 55, 0.15); color: #d4af37; font-size: 10px; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3); font-weight: 600; text-transform: uppercase; }

/* Main Dark Ride Sheet */
.sheet { flex: 1; background: #0e1117; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 14px 18px 18px 18px; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); border-top: 1px solid #1f2433; overflow-y: auto; display: flex; flex-direction: column; }
.sheet-handle { width: 40px; height: 4px; background: #2f3446; border-radius: 2px; margin: 0 auto 12px auto; }

.input-group { position: relative; margin-bottom: 10px; }
.input-group label { position: absolute; left: 14px; top: 7px; font-size: 9px; text-transform: uppercase; color: #8c93a8; letter-spacing: 1px; font-weight: bold; z-index: 2; }
.input-group input { width: 100%; padding: 22px 14px 6px 14px; background: #141824; border: 1px solid #222838; border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
.input-group input:focus { border-color: #d4af37; }

.form-row { display: flex; gap: 8px; }
.form-row .input-group { flex: 1; }

/* Ride Selector Option Card */
.ride-option { display: flex; align-items: center; justify-content: space-between; background: #141824; border: 2px solid #d4af37; border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
.ride-info h3 { font-size: 14px; color: #fff; margin-bottom: 1px; font-weight: 700; }
.ride-info p { font-size: 11px; color: #9da3b8; }
.ride-price-container { text-align: right; }
.ride-price { font-size: 17px; font-weight: bold; color: #d4af37; }
.fare-toggle { font-size: 9px; color: #8c93a8; text-decoration: underline; cursor: pointer; margin-top: 1px; }

/* Fare Breakdown Tooltip / Box */
.fare-breakdown { background: #161b26; border: 1px solid #282f42; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 11px; color: #9da3b8; display: none; }
.fare-breakdown.show { display: block; }
.fare-breakdown div { display: flex; justify-content: space-between; margin-bottom: 3px; }
.fare-breakdown div:last-child { margin-bottom: 0; color: #fff; font-weight: bold; border-top: 1px solid #222838; padding-top: 3px; }

/* Action Buttons */
.action-row { display: flex; gap: 8px; margin-top: 6px; }
.btn-primary { flex: 2; padding: 12px; background: #d4af37; color: #000; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.2s; }
.btn-primary:hover { background: #e5be40; }
.btn-secondary { flex: 1; padding: 12px; background: #1a202c; color: #b0b7c9; border: 1px solid #2f364a; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
.btn-secondary:hover { background: #252c3d; color: #fff; }

.cashapp-btn { width: 100%; padding: 10px; background: #00D632; color: #000; border-radius: 10px; font-size: 14px; font-weight: bold; text-align: center; text-decoration: none; display: block; margin-top: 6px; box-sizing: border-box; }

/* Bottom Nav Bar */
.bottom-nav { display: flex; justify-content: space-around; background: #050608; border-top: 1px solid #12151e; padding: 8px 0; }
.nav-item { text-align: center; color: #6e758c; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; cursor: pointer; }
.nav-item.active { color: #d4af37; }
.nav-item span { display: block; font-size: 16px; margin-bottom: 1px; }
</style>
</head>
<body>

<div class="navbar">
  <h1>LUXURY LIFTS</h1>
  <div class="status-pill">● CT4 Ready</div>
</div>

<!-- Map Up Top -->
<div id="map"></div>

<!-- Dark Luxury Sheet on Bottom -->
<div class="sheet">
  <div class="sheet-handle"></div>
  
  <form id="form">
    <div class="input-group">
      <label for="pickup">Pickup Address</label>
      <input type="text" id="pickup" placeholder="Enter pickup location..." autocomplete="off" required>
    </div>
    
    <div class="input-group">
      <label for="dropoff">Dropoff Address</label>
      <input type="text" id="dropoff" placeholder="Enter dropoff location..." autocomplete="off" required>
    </div>

    <div class="form-row">
      <div class="input-group">
        <label for="passengers">Passengers</label>
        <input type="number" id="passengers" value="1" min="1" required>
      </div>
    </div>

    <div class="ride-option">
      <div class="ride-info">
        <h3>Cadillac CT4 Luxury</h3>
        <p>Private Chauffeur • 350T Turbo</p>
      </div>
      <div class="ride-price-container">
        <div class="ride-price" id="tier-price">$15.00</div>
        <div class="fare-toggle" onclick="toggleBreakdown()">Details</div>
      </div>
    </div>

    <!-- Expandable Fare Breakdown Tooltip -->
    <div class="fare-breakdown" id="fareBreakdownBox">
      <div id="breakdown-base"><span>Base Rate (Saginaw Local):</span> <span>$15.00</span></div>
      <div id="breakdown-zone"><span>Zone Surcharge / Mileage:</span> <span>$0.00</span></div>
      <div id="breakdown-passengers"><span>Extra Passengers:</span> <span>$0.00</span></div>
      <div><span>Calculated Total:</span> <span id="breakdown-total">$15.00</span></div>
    </div>

    <div class="action-row">
      <button type="submit" class="btn-primary">Request Lift</button>
      <button type="button" class="btn-secondary" onclick="resetForm()">Clear</button>
    </div>

    <a href="https://cash.app/$FlipBucks11" target="_blank" class="cashapp-btn">Pay with Cash App</a>
  </form>
</div>

<div class="bottom-nav">
  <div class="nav-item active">
    <span>🚗</span>Book
  </div>
  <div class="nav-item" onclick="alert('Direct Dispatch: 989-964-1792')">
    <span>📞</span>Support
  </div>
  <div class="nav-item" onclick="window.open('https://cash.app/$FlipBucks11', '_blank')">
    <span>💵</span>Cash App
  </div>
</div>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: false }).setView([43.4195, -83.9531], 13);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  attribution: ''
}).addTo(map);

const ct4Icon = L.divIcon({
  className: 'custom-car-marker',
  html: '<div>🚗 Cadillac CT4 Ready</div>',
  iconSize: [130, 36],
  iconAnchor: [65, 18]
});
L.marker([43.4195, -83.9531], { icon: ct4Icon }).addTo(map);

const pickupInput = document.getElementById('pickup');
const dropoffInput = document.getElementById('dropoff');
const passInput = document.getElementById('passengers');
const tierPrice = document.getElementById('tier-price');
const breakdownBox = document.getElementById('fareBreakdownBox');
const breakdownBase = document.getElementById('breakdown-base');
const breakdownZone = document.getElementById('breakdown-zone');
const breakdownPassengers = document.getElementById('breakdown-passengers');
const breakdownTotal = document.getElementById('breakdown-total');

function toggleBreakdown() {
  breakdownBox.classList.toggle('show');
}

function calculateFareDetails() {
  const p = pickupInput.value.toLowerCase();
  const d = dropoffInput.value.toLowerCase();
  const passengers = parseInt(passInput.value) || 1;

  const isBayCity = (text) => text.includes('bay city') || text.includes('euclid') || text.includes('baycounty');
  const isMidland = (text) => text.includes('midland');
  const isFrankenmuth = (text) => text.includes('frankenmuth') || text.includes('bavarian');
  const isBridgeport = (text) => text.includes('bridgeport');
  const isDtw = (text) => text.includes('dtw') || text.includes('airport');

  const pOuter = isBayCity(p) || isMidland(p) || isFrankenmuth(p) || isBridgeport(p) || isDtw(p);
  const dOuter = isBayCity(d) || isMidland(d) || isFrankenmuth(d) || isBridgeport(d) || isDtw(d);

  let base = 15;
  let zone = 0;
  let label = "Local Saginaw Flat";

  if (isDtw(p) || isDtw(d)) {
    base = 50;
    zone = 120;
    label = "DTW Airport Run";
  } else if (!pOuter && isBridgeport(d)) {
    zone = 5;
    label = "Bridgeport Surcharge";
  } else if (!pOuter && (isBayCity(d) || isFrankenmuth(d))) {
    zone = 15;
    label = "Bay City / Frankenmuth Zone";
  } else if (!pOuter && isMidland(d)) {
    zone = 30;
    label = "Midland Distance Fee";
  } else if (isBridgeport(p) && !dOuter) {
    zone = 10;
    label = "Bridgeport Pickup";
  } else if ((isBayCity(p) || isFrankenmuth(p)) && !dOuter) {
    zone = 30;
    label = "Outer Zone Pickup";
  } else if (isMidland(p) && !dOuter) {
    zone = 30;
    label = "Midland Pickup";
  } else if (pOuter || dOuter) {
    zone = 20;
    label = "Inter-City Fare";
  }

  // Extra passenger charge: $5 for each additional passenger past 1
  const extraPassengers = Math.max(0, passengers - 1);
  const passengerFee = extraPassengers * 5;

  const total = base + zone + passengerFee;

  return { base, zone, passengerFee, total, label, passengers };
}

function updatePrice() {
  const res = calculateFareDetails();
  tierPrice.innerText = `$${res.total.toFixed(2)}`;
  breakdownBase.innerHTML = `<span>Base Rate:</span> <span>$${res.base.toFixed(2)}</span>`;
  breakdownZone.innerHTML = `<span>${res.label}:</span> <span>$${res.zone.toFixed(2)}</span>`;
  breakdownPassengers.innerHTML = `<span>Extra Passengers (${Math.max(0, res.passengers - 1)}x $5):</span> <span>$${res.passengerFee.toFixed(2)}</span>`;
  breakdownTotal.innerText = `$${res.total.toFixed(2)}`;
}

function resetForm() {
  pickupInput.value = '';
  dropoffInput.value = '';
  passInput.value = '1';
  updatePrice();
  pickupInput.focus();
}

updatePrice();

['input', 'keyup', 'change', 'paste'].forEach(eventType => {
  pickupInput.addEventListener(eventType, updatePrice);
  dropoffInput.addEventListener(eventType, updatePrice);
  passInput.addEventListener(eventType, updatePrice);
});

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  const p = pickupInput.value;
  const d = dropoffInput.value;
  const pass = passInput.value;
  const res = calculateFareDetails();
  
  window.location.href = `sms:9899641792?body=` + encodeURIComponent(`New Ride Request!\nVehicle: Cadillac CT4 350T\nPickup: ${p}\nDropoff: ${d}\nPassengers: ${pass}\nTotal: $${res.total.toFixed(2)}`);
});
</script>
</body>
</html>
