<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Luxury Lifts</title>
<!-- Leaflet CSS for Real Interactive Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #0f1015; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Real Map Background Container */
#map { position: absolute; top: 0; left: 0; width: 100%; height: 52%; z-index: 1; background: #141721; }

/* Dark mode styling for OpenStreetMap tiles */
.leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-control-attribution {
  filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
}

/* App Top Navigation */
.navbar { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(15, 16, 21, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #262a36; }
.navbar h1 { font-size: 18px; color: #d4af37; letter-spacing: 1px; font-weight: 700; }
.status-pill { background: rgba(212, 175, 55, 0.15); color: #d4af37; font-size: 11px; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3); font-weight: 600; text-transform: uppercase; }

/* Main Ride Sheet */
.sheet { position: relative; z-index: 3; margin-top: auto; background: #161821; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px 20px 25px 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.6); border-top: 1px solid #2a2e3d; max-height: 75vh; overflow-y: auto; }
.sheet-handle { width: 40px; height: 4px; background: #3a3f52; border-radius: 2px; margin: 0 auto 15px auto; }

.input-group { position: relative; margin-bottom: 12px; }
.input-group label { position: absolute; left: 14px; top: 10px; font-size: 10px; text-transform: uppercase; color: #8c93a8; letter-spacing: 1px; font-weight: bold; }
.input-group input { width: 100%; padding: 26px 14px 10px 14px; background: #212431; border: 1px solid #2f3446; border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
.input-group input:focus { border-color: #d4af37; }

/* Ride Selector Option Card */
.ride-option { display: flex; align-items: center; justify-content: space-between; background: #212431; border: 2px solid #d4af37; border-radius: 12px; padding: 12px 16px; margin: 15px 0; cursor: pointer; }
.ride-info h3 { font-size: 15px; color: #fff; margin-bottom: 2px; }
.ride-info p { font-size: 12px; color: #a0a6bc; }
.ride-price { font-size: 18px; font-weight: bold; color: #d4af37; }

/* Action Buttons */
.btn-primary { width: 100%; padding: 15px; background: #d4af37; color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; transition: background 0.2s; }
.btn-primary:hover { background: #e5be40; }
.cashapp-btn { width: 100%; padding: 14px; background: #00D632; color: #000; border-radius: 12px; font-size: 15px; font-weight: bold; text-align: center; text-decoration: none; display: block; margin-top: 10px; box-sizing: border-box; }

/* Bottom Nav Bar */
.bottom-nav { display: flex; justify-content: space-around; background: #111319; border-top: 1px solid #222634; padding: 10px 0; position: relative; z-index: 3; }
.nav-item { text-align: center; color: #737b93; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; cursor: pointer; }
.nav-item.active { color: #d4af37; }
.nav-item span { display: block; font-size: 18px; margin-bottom: 2px; }
</style>
</head>
<body>

<!-- Real Map Container -->
<div id="map"></div>

<div class="navbar">
  <h1>LUXURY LIFTS</h1>
  <div class="status-pill">● CT4 Ready</div>
</div>

<div class="sheet">
  <div class="sheet-handle"></div>
  
  <form id="form">
    <div class="input-group">
      <label for="pickup">Pickup</label>
      <input type="text" id="pickup" placeholder="Enter pickup location" required>
    </div>
    
    <div class="input-group">
      <label for="dropoff">Dropoff</label>
      <input type="text" id="dropoff" placeholder="Enter destination" required>
    </div>

    <div class="input-group" style="margin-bottom: 5px;">
      <label for="passengers">Passengers</label>
      <input type="number" id="passengers" value="1" min="1" required>
    </div>

    <!-- App-style Ride Tier Card -->
    <div class="ride-option">
      <div class="ride-info">
        <h3>Cadillac CT4 Luxury</h3>
        <p>Private Chauffeur • 350T Turbo</p>
      </div>
      <div class="ride-price" id="tier-price">$15.00</div>
    </div>

    <button type="submit" class="btn-primary">Request Luxury Lift</button>
    <a href="https://cash.app/$FlipBucks11" target="_blank" class="cashapp-btn">Pay with Cash App</a>
  </form>
</div>

<div class="bottom-nav">
  <div class="nav-item active">
    <span>🚗</span>Book
  </div>
  <div class="nav-item" onclick="alert('Direct Dispatch: 989-964-1792')">
    <span>📞</span>Support
  </div>
  <div class="nav-item" onclick="window.open('https://cash.app/$FlipBucks11', '_blank')">
    <span>💵</span>Cash App
  </div>
</div>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Initialize real map centered on Saginaw, MI
const map = L.map('map', { zoomControl: false }).setView([43.4195, -83.9531], 13);

// Add OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: ''
}).addTo(map);

// Add a custom marker for your Cadillac CT4 position in Saginaw
const ct4Icon = L.divIcon({
  className: 'custom-car-marker',
  html: '<div style="background:#161821; border:2px solid #d4af37; color:#d4af37; padding:4px 8px; border-radius:12px; font-size:11px; font-weight:bold; white-space:nowrap; box-shadow:0 4px 10px rgba(0,0,0,0.6);">🚗 CT4 Ready</div>',
  iconSize: [80, 30],
  iconAnchor: [40, 15]
});
L.marker([43.4195, -83.9531], { icon: ct4Icon }).addTo(map);

const pickupInput = document.getElementById('pickup');
const dropoffInput = document.getElementById('dropoff');
const passInput = document.getElementById('passengers');
const tierPrice = document.getElementById('tier-price');

function calculateFare() {
  const p = pickupInput.value.toLowerCase();
  const d = dropoffInput.value.toLowerCase();

  const isSaginawCityOrTownship = (text) => text.includes('saginaw') || text.includes('oakley') || text.includes('bay road') || text.includes('mackinaw') || text.includes('janes') || text.includes('washington') || text.includes('michigan') || text.includes('tittabawassee') || text.includes('state') || text.includes('court');
  const isBridgeport = (text) => text.includes('bridgeport');
  const isFrankenmuth = (text) => text.includes('frankenmuth');
  const isBayCity = (text) => text.includes('bay city');
  const isMidland = (text) => text.includes('midland');

  if (isSaginawCityOrTownship(p) && isSaginawCityOrTownship(d)) return 15;
  if (isSaginawCityOrTownship(p) && isBridgeport(d)) return 20;
  if (isBridgeport(p) && isSaginawCityOrTownship(d)) return 25;
  if (isSaginawCityOrTownship(p) && (isFrankenmuth(d) || isBayCity(d))) return 30;
  if ((isFrankenmuth(p) || isBayCity(p)) && isSaginawCityOrTownship(d)) return 45;
  if ((isSaginawCityOrTownship(p) && isMidland(d)) || (isMidland(p) && isSaginawCityOrTownship(d))) return 45;

  return 35;
}

function updatePrice() {
  const pText = pickupInput.value.trim();
  const dText = dropoffInput.value.trim();
  if (pText.length > 0 && dText.length > 0) {
    const total = calculateFare();
    tierPrice.innerText = `$${total.toFixed(2)}`;
  } else {
    tierPrice.innerText = `$15.00`;
  }
}

pickupInput.addEventListener('input', updatePrice);
dropoffInput.addEventListener('input', updatePrice);
passInput.addEventListener('input', updatePrice);

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  const p = pickupInput.value;
  const d = dropoffInput.value;
  const pass = passInput.value;
  const total = calculateFare();
  window.location.href = `sms:9899641792?body=` + encodeURIComponent(`New Ride Request!\nVehicle: Cadillac CT4 350T\nPickup: ${p}\nDropoff: ${d}\nPassengers: ${pass}\nTotal: $${total.toFixed(2)}`);
});
</script>
</body>
</html>
