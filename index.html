<script>
  let userLat = null;
  let userLon = null;
  const wCheck = document.getElementById('waiver-check');
  const aBtn = document.getElementById('agree-btn');
  const wModal = document.getElementById('waiver-modal');

  if (localStorage.getItem('luxury_waiver_agreed') === 'true') { wModal.style.display = 'none'; }

  wCheck.addEventListener('change', function() {
    if (this.checked) { aBtn.disabled = false; aBtn.classList.add('active'); } 
    else { aBtn.disabled = true; aBtn.classList.remove('active'); }
  });

  aBtn.addEventListener('click', function() {
    if (!aBtn.disabled) { localStorage.setItem('luxury_waiver_agreed', 'true'); wModal.style.display = 'none'; }
  });

  document.getElementById('geo-btn').addEventListener('click', function() {
    const btn = this;
    if (navigator.geolocation) {
      btn.innerText = "Locating...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
          document.getElementById('pickup').value = `GPS Pin (${userLat.toFixed(4)}, ${userLon.toFixed(4)})`;
          btn.innerText = "✓ Location Detected";
        },
        () => { alert("Ensure location permissions are enabled."); btn.innerText = "📍 Detect Current GPS Location"; }
      );
    }
  });document.getElementById('booking-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const pickup = document.getElementById('pickup').value;
  const dropoff = document.getElementById('dropoff').value;
  const p = parseInt(document.getElementById('passengers').value) || 0;
  
  let estimatedMiles = 5.0; 
  const total = 2.00 + (estimatedMiles * 2.00) + (p * 0.25);
  
  document.getElementById('fare-price').innerText = '$' + total.toFixed(2);
  document.getElementById('fare-breakdown').innerText = estimatedMiles + ' estimated road miles + ' + p + ' extra passenger(s)';
  document.getElementById('result').style.display = 'block';

  const myPhoneNumber = "9899641792";
  const message = encodeURIComponent(`New Luxury Lifts Ride Request!\nPickup: ${pickup}\nDropoff: ${dropoff}\nPassengers: ${p}\nTotal Fare: $${total.toFixed(2)}`);
    const myPhoneNumber = "9899641792";
  window.location.href = `sms:${myPhoneNumber}?body=New%20Ride%20Request!`;

  window.location.href = `sms:${myPhoneNumber}?body=${message}`;
});

</script>
